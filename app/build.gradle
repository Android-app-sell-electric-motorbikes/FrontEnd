plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.android)
}

android {
    namespace 'com.example.evshop'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.evshop"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def localProps = new Properties()
        def lpFile = rootProject.file("local.properties")
        if (lpFile.exists()) {
            lpFile.withInputStream { localProps.load(it) }
        }
        def VIETMAP_KEY = (localProps.getProperty("VIETMAP_API_KEY") ?: "")

        buildConfigField "String", "VIETMAP_API_KEY", "\"${VIETMAP_KEY}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

hilt {
    enableAggregatingTask = false
}

dependencies {
    // ---- CORE & UI LIBS (Sắp xếp lại) ----
    implementation libs.core.ktx // Core-KTX
    implementation libs.appcompat.v170 // Appcompat
    implementation libs.material // Material Design
    implementation libs.constraintlayout // ConstraintLayout
    implementation libs.recyclerview // RecyclerView
    implementation libs.swiperefreshlayout // SwipeRefreshLayout
    implementation libs.androidx.cardview // CardView
    implementation libs.viewpager2 // ViewPager2
    implementation libs.shimmer // Facebook Shimmer for loading effects

    // ---- NAVIGATION COMPONENT ----
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // ---- LIFECYCLE / VIEWMODEL / LIVEDATA ----
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.viewmodel
    // implementation "androidx.lifecycle:lifecycle-extensions:2.2.0" // Ghi chú: Thư viện này đã bị deprecated, không nên dùng

    // ---- HILT (Dependency Injection) ----
    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    // ---- NETWORKING (BỘ DUY NHẤT ĐÚNG) ----
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.okhttp
    implementation libs.logging.interceptor

    // ---- IMAGE LOADING ----
    implementation libs.glide
    annotationProcessor libs.compiler
    implementation 'com.squareup.picasso:picasso:2.8' // Ghi chú: Bạn nên chọn 1 trong 2: Glide hoặc Picasso

    // ---- VIETMAP ----
    implementation libs.maps.sdk.android.v260
    implementation 'com.github.vietmap-company:maps-sdk-navigation-ui-android:2.3.2'
    implementation 'com.github.vietmap-company:maps-sdk-navigation-android:2.3.3'
    implementation 'com.github.vietmap-company:vietmap-services-core:1.0.0'
    implementation 'com.github.vietmap-company:vietmap-services-directions-models:1.0.1'
    implementation 'com.github.vietmap-company:vietmap-services-turf-android:1.0.2'
    implementation 'com.github.vietmap-company:vietmap-services-android:1.1.2'
    implementation 'com.github.vietmap-company:vietmap-services-geojson-android:1.0.0'
    implementation 'com.github.vietmap-company:maps-sdk-plugin-localization-android:2.0.0'

    // ---- GOOGLE SERVICES ----
    implementation libs.play.services.location
    implementation libs.play.services.maps
    implementation libs.firebase.messaging // Firebase Cloud Messaging
    implementation libs.identity.jvm // Identity

    // ---- TESTING ----
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // ---- KHÁC ----
    implementation libs.javapoet // Thư viện này thường dùng cho code generation, Hilt cần nó.
    // implementation "com.jakewharton:butterknife:10.2.3" // Ghi chú: Bạn đang dùng ViewBinding, không cần ButterKnife nữa.
}

// Giữ lại phần này nếu cần
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.squareup" && details.requested.name == "javapoet") {
            details.useVersion "1.13.0"
        }
    }
}
