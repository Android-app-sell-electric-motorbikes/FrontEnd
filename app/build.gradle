// build.gradle (Module :app)

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt.android)
}

android {
    namespace 'com.example.evshop'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.evshop"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def localProps = new Properties()
        def lpFile = rootProject.file("local.properties")
        if (lpFile.exists()) {
            lpFile.withInputStream { localProps.load(it) }
        }
        def VIETMAP_KEY = (localProps.getProperty("VIETMAP_API_KEY") ?: "")

        buildConfigField "String", "VIETMAP_API_KEY", "\"${VIETMAP_KEY}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

hilt {
    enableAggregatingTask = false
}

dependencies {
    // ---- CORE & UI LIBS ----
    implementation libs.core.ktx
    implementation libs.appcompat.v170
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.recyclerview
    implementation libs.swiperefreshlayout
    implementation libs.androidx.cardview
    implementation libs.viewpager2
    implementation libs.shimmer
    implementation 'com.auth0.android:jwtdecode:2.0.2'

    // ---- VNPAY SDK (ĐÃ BỊ XÓA VÌ KHÔNG CẦN THIẾT) ----

    // ---- NAVIGATION COMPONENT ----
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // ---- LIFECYCLE / VIEWMODEL / LIVEDATA ----
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.viewmodel

    // ---- HILT (Dependency Injection) ----
    implementation libs.hilt.android
    implementation libs.androidx.window
    implementation libs.androidx.activity
    implementation libs.androidx.camera.camera2.pipe
    annotationProcessor libs.hilt.compiler

    // ---- NETWORKING ----
    def retrofitVersion = "2.9.0"
    def okhttpVersion = "4.12.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofitVersion"
    implementation "com.squareup.retrofit2:converter-gson:$retrofitVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttpVersion"

    // ---- IMAGE LOADING ----
    implementation libs.glide
    annotationProcessor libs.compiler

    // ---- VIETMAP ----
    implementation libs.maps.sdk.android.v260
    implementation 'com.github.vietmap-company:maps-sdk-navigation-ui-android:2.3.2'
    implementation 'com.github.vietmap-company:maps-sdk-navigation-android:2.3.3'
    implementation 'com.github.vietmap-company:vietmap-services-core:1.0.0'
    implementation 'com.github.vietmap-company:vietmap-services-directions-models:1.0.1'
    implementation 'com.github.vietmap-company:vietmap-services-turf-android:1.0.2'
    implementation 'com.github.vietmap-company:vietmap-services-android:1.1.2'
    implementation 'com.github.vietmap-company:vietmap-services-geojson-android:1.0.0'
    implementation 'com.github.vietmap-company:maps-sdk-plugin-localization-android:2.0.0'

    // ---- GOOGLE SERVICES & FIREBASE ----
    implementation libs.play.services.location
    implementation libs.play.services.maps
    implementation libs.firebase.messaging
    implementation libs.identity.jvm

    // ---- TESTING ----
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // ---- KHÁC ----
    implementation libs.javapoet

    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-messaging'
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.squareup" && details.requested.name == "javapoet") {
            details.useVersion "1.13.0"
        }
    }
}
